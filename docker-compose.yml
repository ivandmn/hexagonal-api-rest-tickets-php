networks:
  default:
    name: ${EXTERNAL_NET}
    external: true

services:
  app-tickets:
    build:
      context: .
      dockerfile: etc/app/prod/Dockerfile
    container_name: app-tickets
    env_file: .env
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  caddy_data:
  caddy_config:
