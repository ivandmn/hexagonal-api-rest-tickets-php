services:
  app-tickets:
    image: tickets-api:dev
    pull_policy: missing
    build:
      context: .
      target: dev
      args:
        USER: ${USER:-app}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        USER_NAME: ${USER_NAME:-}
        USER_EMAIL: ${USER_EMAIL:-}
    restart: "no"
    env_file:
      - path: .env
      - path: .env.local
        required: false
    environment:
      # Your SSH agent instead of ~/.ssh: git over SSH works without the private keys entering the
      # container. Start it on the host first (`eval "$(ssh-agent)" && ssh-add`).
      SSH_AUTH_SOCK: /ssh-agent
    ports:
      - "127.0.0.1:${HTTP_WEB_PORT:-8080}:80"
    volumes:
      - ./:/web
      # Edit Caddy without rebuilding: `make restart` picks up the change.
      - ./etc/caddy/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    extra_hosts:
      - host.docker.internal:host-gateway
    deploy:
      resources:
        limits:
          memory: 2g
