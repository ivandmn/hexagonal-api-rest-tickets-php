services:
  app-tickets:
    build:
      dockerfile: etc/app/dev/Dockerfile
      args:
        USER: ${USER}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
        USER_NAME: ${USER_NAME}
        USER_EMAIL: ${USER_EMAIL}
    restart: "no"
    env_file:
      - path: .env
      - path: .env.local
        required: false
    ports:
      - "127.0.0.1:${HTTP_WEB_PORT:-8080}:80"
    volumes:
      - ./:/web
      - ~/.ssh:/home/${USER}/.ssh:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    deploy:
      resources:
        limits:
          memory: 2g

  # Database for the test suite only (see TEST_DATABASE_URL in .env.test). Kept in memory: it
  # starts empty on every `up`, so `make test-db` recreates the schema.
  tickets-db-test:
    image: postgres:18-alpine
    restart: "no"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tickets_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tickets_test"]
      interval: 2s
      timeout: 3s
      retries: 15
