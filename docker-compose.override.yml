services:
  app-tickets:
    image: tickets-api:dev
    pull_policy: missing
    build:
      context: .
      target: dev
      args:
        USER: ${USER:-app}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        USER_NAME: ${USER_NAME:-}
        USER_EMAIL: ${USER_EMAIL:-}
    restart: "no"
    env_file:
      - path: .env
      - path: .env.local
        required: false
    environment:
      # Your SSH agent instead of ~/.ssh: git over SSH works without the private keys entering the
      # container. Start it on the host first (`eval "$(ssh-agent)" && ssh-add`).
      SSH_AUTH_SOCK: /ssh-agent
    ports:
      - "127.0.0.1:${HTTP_WEB_PORT:-8080}:80"
    volumes:
      - ./:/web
      # Edit Caddy without rebuilding: `make restart` picks up the change.
      - ./etc/caddy/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g

  # Development database, so `make up` is self-contained. .env.example points at it
  # (DB_HOST=database, app/app, tickets); then `make db-migrate`.
  database:
    image: postgres:18-alpine
    restart: "no"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tickets
    volumes:
      # Postgres 18+ keeps its data under a versioned sub-directory: mount the parent.
      - db_data:/var/lib/postgresql
    ports:
      # Local only, for your IDE or SQL client.
      - "127.0.0.1:${DB_LOCAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tickets"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Database for the test suite only (see TEST_DATABASE_URL in .env.test). Kept in memory: it
  # starts empty on every `up`, so `make test-db` recreates the schema.
  tickets-db-test:
    image: postgres:18-alpine
    restart: "no"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tickets_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tickets_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db_data:
