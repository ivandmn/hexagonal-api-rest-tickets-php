# Dependency rules between layers (hexagonal architecture + DDD).
#
#   UI ──┐
#        ├──► Application ──► Domain
#   Infra┘   (Infra implements the Domain/Application Ports)
#
# Domain depends on nothing; UI and Infrastructure sit at the same level
# (UI = HTTP/CLI entry points, Infrastructure = exit points), so they
# must NOT depend on each other.
#
# Vendor code is split into layers too, so the "no framework in the core"
# rule is enforced instead of just documented: Domain and Application may
# only use the framework-agnostic libraries in CoreLibraries.
#
# Run with: make deptrac
deptrac:
  paths:
    - ./src

  cache_file: ./var/cache/deptrac.cache

  layers:
    -
      name: Domain
      collectors:
        -
          type: classLike
          value: ^App\\Domain\\
    -
      name: Application
      collectors:
        -
          type: classLike
          value: ^App\\Application\\
    -
      name: Infrastructure
      collectors:
        -
          type: classLike
          value: ^App\\Infrastructure\\
    -
      name: UI
      collectors:
        -
          type: classLike
          value: ^App\\UI\\

    # Framework-agnostic libraries the core can build on: UUIDs and the PSR-20 clock.
    -
      name: CoreLibraries
      collectors:
        -
          type: classLike
          value: ^(Ramsey\\Uuid|Psr\\Clock)\\
    # PSR-3 interface only: logging through the abstraction.
    -
      name: Logging
      collectors:
        -
          type: classLike
          value: ^Psr\\Log\\
    # Frameworks and tooling: only the adapters (Infrastructure/UI) may know them.
    -
      name: Framework
      collectors:
        -
          type: classLike
          value: ^(Symfony|Doctrine|Composer|Nelmio|OpenApi)\\

  ruleset:
    # The domain is the core: it knows no other layer.
    Domain:
      - CoreLibraries

    # Orchestrates the domain and declares the Ports Infrastructure implements.
    Application:
      - Domain
      - CoreLibraries
      - Logging

    # Outbound adapters: Doctrine persistence, message buses, logging.
    Infrastructure:
      - Domain
      - Application
      - CoreLibraries
      - Logging
      - Framework

    # Inbound adapters: HTTP controllers, request mapping, error handling, API docs.
    UI:
      - Domain
      - Application
      - CoreLibraries
      - Logging
      - Framework
