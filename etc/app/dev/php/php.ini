memory_limit = 512M
max_execution_time = 60
date.timezone = UTC

display_errors = Off
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

upload_max_filesize = 50M
post_max_size = 50M

; Defaults can be overridden with env vars (e.g. in .env.local)
xdebug.mode = ${XDEBUG_MODE:-off}
xdebug.start_with_request = ${XDEBUG_START_WITH_REQUEST:-trigger}
xdebug.client_host = ${XDEBUG_CLIENT_HOST:-host.docker.internal}
xdebug.client_port = ${XDEBUG_CLIENT_PORT:-9003}
xdebug.log = ${XDEBUG_LOG:-/proc/self/fd/2}
xdebug.log_level = ${XDEBUG_LOG_LEVEL:-0}

opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
