# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
          - '../src/**/Application/Command/**/*Command.php'
          - '../src/**/Application/Query/**/*Query.php'
          - '../src/**/Application/Event/**/*Event.php'
          - '../src/Application/Service/'
          - '../src/Domain/Model/'
          - '../src/Domain/Exception/'
          - '../src/Domain/ValueObject/'
          - '../src/Domain/Event/'
          - '../src/Domain/Repository/'
          - '../src/Infrastructure/Persistence/Doctrine/Migration/'
          - '../src/Infrastructure/Persistence/Doctrine/Type/'
          - '../src/Infrastructure/Symfony/Kernel.php'
          - '../src/UI/Http/OpenApi/'

    command_handlers:
      namespace: App\Application\Command\
      resource: '%kernel.project_dir%/src/Application/Command/**/*CommandHandler.php'
      public: true
      autoconfigure: false
      tags:
        - { name: messenger.message_handler, bus: command.bus }

    App\Infrastructure\Bus\Symfony\MessengerCommandBus:
      arguments:
        $commandBus: '@command.bus'

    App\Application\Command\CommandBusInterface:
      alias: 'App\Infrastructure\Bus\Symfony\MessengerCommandBus'

    query_handlers:
      namespace: App\Application\Query\
      resource: '%kernel.project_dir%/src/Application/Query/**/*QueryHandler.php'
      public: true
      autoconfigure: false
      tags:
        - { name: messenger.message_handler, bus: query.bus }

    App\Infrastructure\Bus\Symfony\MessengerQueryBus:
      arguments:
        $queryBus: '@query.bus'

    App\Application\Query\QueryBusInterface:
      alias: 'App\Infrastructure\Bus\Symfony\MessengerQueryBus'

    event_handlers:
      namespace: App\Application\Event\
      resource: '%kernel.project_dir%/src/Application/Event/**/*EventHandler.php'
      public: true
      autoconfigure: false
      tags:
        - { name: messenger.message_handler, bus: event.bus }

    App\Infrastructure\Bus\Symfony\MessengerEventBus:
      arguments:
        $eventBus: '@event.bus'

    App\Application\Event\EventBusInterface:
      alias: 'App\Infrastructure\Bus\Symfony\MessengerEventBus'



  # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Application\Service\LoggerInterface:
      class: App\Infrastructure\Service\MonologLogger
      arguments:
        - '@logger'

    App\Domain\Repository\TaskRepositoryInterface:
      alias: 'App\Infrastructure\Persistence\Doctrine\Repository\DoctrineTaskRepository'

    App\Domain\Repository\UserRepositoryInterface:
      alias: 'App\Infrastructure\Persistence\Doctrine\Repository\DoctrineUserRepository'

    App\Infrastructure\Service\ApiRequestValidator:
      arguments:
        - '@serializer'
        - '@validator'

    Symfony\Component\Serializer\Normalizer\ObjectNormalizer:
      arguments:
        $defaultContext:
          allow_extra_attributes: false
