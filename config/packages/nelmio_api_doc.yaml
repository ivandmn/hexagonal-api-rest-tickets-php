nelmio_api_doc:
  documentation:
    info:
      title: Ticket API
      description: |
        Task (ticket) management: users, tasks, assignment and status workflow.

        - Every JSON key is `snake_case`, in requests and responses.
        - Success: `{"status": "success", "data": ...}`; collections add `meta`.
        - Errors: [Problem Details](https://www.rfc-editor.org/rfc/rfc9457) (`application/problem+json`).
          Branch on `type` and `errors[].code`, never on the human-readable texts.
        - Dates: RFC 3339, returned in UTC.
      version: 1.0.0
  areas: # which routes are documented
    path_patterns:
      - ^/api/v1/ # the current API version (the docs pages themselves stay out)
  html_config:
    assets_mode: bundle
    scalar_config:
      theme: purple              # others: moon, solarized, bluePlanet, saturn, kepler, mars, deepSpace
      layout: modern             # or classic
      darkMode: true
      hideModels: true           # hide the models (schemas) section
      persistAuth: true          # keep the auth token across reloads
      defaultOpenAllTags: false  # tags start collapsed
      defaultHttpClient:
        targetKey: shell
        clientKey: curl          # code sample shown by default
