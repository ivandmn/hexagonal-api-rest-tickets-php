framework:
  messenger: # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
    # failure_transport: failed
    default_bus: command.bus
    buses:
      command.bus:
        middleware:
          - validation
          - doctrine_ping_connection
      query.bus:
        middleware:
          - validation
          - doctrine_ping_connection
      event.bus:
        default_middleware: allow_no_handlers
        middleware:
          - validation
          - doctrine_ping_connection

    transports: # https://symfony.com/doc/current/messenger.html#transport-configuration
      # async: '%env(MESSENGER_TRANSPORT_DSN)%'
      # failed: 'doctrine://default?queue_name=failed'
      sync: 'sync://'

    routing: # Route your messages to the transports
      # 'App\Message\YourMessage': async
      App\Domain\Event\Task\TaskAssigned: sync
      App\Domain\Event\Task\TaskCompleted: sync
      App\Domain\Event\User\UserDeleted: sync

