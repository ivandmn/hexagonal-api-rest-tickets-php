framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        prefix_seed: ivandmn/tickets-api

        # The "app" cache (and the Doctrine result cache in prod, see doctrine.yaml) lives in Redis,
        # so it is shared by every worker and survives deploys. The connection is lazy: nothing
        # connects until a pool is used. cache.system stays on the filesystem (it ships in the image).
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

when@test:
    framework:
        cache:
            # Tests never need Redis: each run starts with an empty in-memory cache.
            app: cache.adapter.array
