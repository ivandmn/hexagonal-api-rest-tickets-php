# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Traefik (Dokploy) terminates TLS: without this Symfony would see plain HTTP and the proxy's IP.
    # Only the headers Traefik sends; no port (it follows from proto) and no prefix (no sub-path).
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto']
    # Trusting X-Forwarded-Host needs a host allow-list, or a request that skips Traefik can set
    # any host (absolute URLs, cache poisoning). Comma-separated regexes, e.g. '^api\.example\.com$';
    # unset (dev, tests) means any host.
    trusted_hosts: '%env(default::TRUSTED_HOSTS)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
      handler_id: null
      cookie_secure: auto
      cookie_samesite: lax
      storage_factory_id: session.storage.factory.native

    php_errors:
      log: true

    # The API speaks snake_case both ways: request payloads are mapped from it and responses use it.
    serializer:
      name_converter: 'serializer.name_converter.camel_case_to_snake_case'

    # Log levels only (a status_code here would wrap the exception before the API error listener).
    exceptions:
      # Business errors are expected outcomes, not failures: keep them out of error alerts.
      App\Domain\Exception\DomainException:
        log_level: info
      # Unknown payload fields are a client mistake (answered with 422), not a server error.
      Symfony\Component\Serializer\Exception\ExtraAttributesException:
        log_level: notice

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
