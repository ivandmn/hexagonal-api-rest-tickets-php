# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Traefik (Dokploy) termina el TLS: sin esto Symfony vería http y la IP del proxy
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    # Note that the session will be started ONLY if you read or write from it.
    session:
      handler_id: null
      cookie_secure: auto
      cookie_samesite: lax
      storage_factory_id: session.storage.factory.native

    php_errors:
      log: true

    # Log levels only (a status_code here would wrap the exception before the API error listener).
    exceptions:
      # Business errors are expected outcomes, not failures: keep them out of error alerts.
      App\Domain\Exception\DomainException:
        log_level: info
      # Unknown payload fields are a client mistake (answered with 422), not a server error.
      Symfony\Component\Serializer\Exception\ExtraAttributesException:
        log_level: notice

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
