doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # The app owns the "tickets" schema only: ignore anything else (public, other apps).
        schema_filter: ~^tickets\.~

        # Map columns straight to domain value objects
        types:
            # Shared
            utc_datetime: App\Infrastructure\Persistence\Doctrine\Type\UtcDateTimeType

            # Task
            task_id: App\Infrastructure\Persistence\Doctrine\Type\Task\TaskIdType
            task_title: App\Infrastructure\Persistence\Doctrine\Type\Task\TaskTitleType
            task_description: App\Infrastructure\Persistence\Doctrine\Type\Task\TaskDescriptionType
            task_status: App\Infrastructure\Persistence\Doctrine\Type\Task\TaskStatusType
            task_priority: App\Infrastructure\Persistence\Doctrine\Type\Task\TaskPriorityType
            task_due_date: App\Infrastructure\Persistence\Doctrine\Type\Task\TaskDueDateType

            # User
            user_id: App\Infrastructure\Persistence\Doctrine\Type\User\UserIdType
            user_email: App\Infrastructure\Persistence\Doctrine\Type\User\UserEmailType
            user_name: App\Infrastructure\Persistence\Doctrine\Type\User\UserNameType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Domain\Model'
                alias: App

when@test:
    doctrine:
        dbal:
            # A dedicated variable, never DATABASE_URL: real environment variables (e.g. the app
            # container's env_file) win over .env.test, so tests could otherwise hit the app database.
            url: '%env(resolve:TEST_DATABASE_URL)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
