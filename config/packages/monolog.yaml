monolog:
  channels: # To see all channels, run bin/console debug:autowiring logger
    - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
    - app
    - doctrine

  handlers:
    main:
      type: stream
      path: php://stdout
      level: info
      formatter: App\Infrastructure\Logging\Monolog\Formatter\AppLogFormatter
      channels: ["app"]
    error:
      type: stream
      path: php://stdout
      level: error
      formatter: App\Infrastructure\Logging\Monolog\Formatter\AppLogFormatter
      channels: ["doctrine", "deprecation", "cache", "php", "request"]
    console:
      type: console
      process_psr_3_messages: false
      channels: ["!event", "!doctrine", "!console" ,"!deprecation", "!messenger", "!app"]


when@local:
  monolog:
    handlers:
      main_file:
        type: stream
        path: "%kernel.logs_dir%/%kernel.environment%.log"
        level: info
        formatter: App\Infrastructure\Logging\Monolog\Formatter\AppLogFormatter
        channels: ["app"]
      error_file:
        type: stream
        path: "%kernel.logs_dir%/%kernel.environment%.log"
        level: error
        formatter: App\Infrastructure\Logging\Monolog\Formatter\AppLogFormatter
        channels: ["doctrine", "deprecation", "cache", "php", "request"]
      doctrine:
        type: stream
        path: "%kernel.logs_dir%/%kernel.environment%_doctrine.log"
        level: debug
        formatter: App\Infrastructure\Logging\Monolog\Formatter\AppLogFormatter
        channels: ["doctrine"]
      deprecation:
        type: stream
        path: "%kernel.logs_dir%/%kernel.environment%_deprecation.log"
        level: debug
        formatter: App\Infrastructure\Logging\Monolog\Formatter\AppLogFormatter
        channels: ["deprecation"]

when@stg:
  monolog:
    handlers:
      console:
        enabled: false

when@prod:
  monolog:
    handlers:
      console:
        enabled: false

when@test:
  monolog:
    handlers:
      main:
        type: stream
        path: "%kernel.logs_dir%/%kernel.environment%.log"
        level: debug
      error:
        type: stream
        path: "%kernel.logs_dir%/%kernel.environment%.log"
